query Controls(
  $createTask: ID!
  $completeTask: ID!
  $inquiryTask: ID!
  $checkTask: ID!
  $caseId: ID!
  $currentGroup: String!
) {
  create: allWorkItems(
    filter: [
      { case: $caseId }
      { task: $createTask }
      { status: READY }
      { addressedGroups: [$currentGroup] }
    ]
  ) {
    edges {
      node {
        id
        status
      }
    }
  }
  complete: allWorkItems(
    filter: [
      { case: $caseId }
      { task: $completeTask }
      { status: READY }
      { addressedGroups: [$currentGroup] }
    ]
  ) {
    edges {
      node {
        id
        status
      }
    }
  }
  send: allWorkItems(
    filter: [
      { case: $caseId }
      { task: $inquiryTask }
      { status: SUSPENDED }
      { controllingGroups: [$currentGroup] }
    ]
  ) {
    edges {
      node {
        id
        status
      }
    }
  }
  check: allWorkItems(
    filter: [
      { case: $caseId }
      { task: $checkTask }
      { status: READY }
      { hasDeadline: true }
      { addressedGroups: [$currentGroup] }
    ]
  ) {
    edges {
      node {
        id
        status
      }
    }
  }
  case: allCases(filter: [{ ids: [$caseId] }]) {
    edges {
      node {
        id
        parentWorkItem {
          id
          isRedoable
          addressedGroups
        }
        # A new inquiry document doesn't exist in the backend yet, so its
        # global JEXL context can't be fetched via `documentGlobalJexlContext`
        # and has to be assembled from the case.
        # See `#buildJexlContext` in `cd-inquiry-new-form/bulk-edit.js`
        meta
        workflow {
          id
          slug
        }
        document {
          id
          form {
            id
            slug
          }
        }
        family {
          id
          meta
          workflow {
            id
            slug
          }
          document {
            id
            form {
              id
              slug
            }
          }
        }
      }
    }
  }
}
