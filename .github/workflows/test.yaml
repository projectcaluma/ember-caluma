  test-compatibility:
    name: Compatibility Tests
    needs: [lint]
    runs-on: [ubuntu-latest]
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        scenario:
          - ember-lts-4.12
          - ember-lts-5.4
          - ember-lts-5.8
          - ember-lts-5.12
          - ember-release
          - embroider-safe
          - embroider-optimized
        workspace:
          - "@projectcaluma/ember-analytics"
          - "@projectcaluma/ember-core"
          - "@projectcaluma/ember-distribution"
          - "@projectcaluma/ember-form"
          - "@projectcaluma/ember-form-builder"
          - "@projectcaluma/ember-testing"
          - "@projectcaluma/ember-workflow"
        include:
          # These scenarios are currently failing - we expect this, but we won't
          # be able to fix it short term (embroider support is depending on
          # `ember-validated-form` and ember v7 support will probably need a
          # larger rewrite), which is why we allow them to fail for now.
          - scenario: ember-release
            allowedToFail: true
          - scenario: embroider-safe
            allowedToFail: true
          - scenario: embroider-optimized
            allowedToFail: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        id: tests
        continue-on-error: ${{ matrix.allowedToFail || false }}
        run: pnpm --filter ${{ matrix.workspace }} exec ember try:one ${{ matrix.scenario }} --skip-cleanup
      - name: Report allowed failure
        if: steps.tests.outcome == 'failure'
        run: echo "::warning title=Allowed failure::${{ matrix.scenario }} failed for ${{ matrix.workspace }} - allowed to fail"

  build:
    name: Test docs app build
    needs: [test]
    runs-on: [ubuntu-latest]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run build
        run: pnpm run --filter ember-caluma build
